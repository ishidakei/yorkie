# Based on https://github.com/actions-rs/meta/blob/master/recipes/quickstart.md
#
# While our "example" application has the platform-specific code,
# for simplicity we are compiling and testing everything on the Ubuntu environment only.
# For multi-OS testing see the `cross.yml` workflow.
#
# The eval features `material` and `nnue` are mutually exclusive (they hit a
# `compile_error!` together in `src/evaluate/mod.rs`), so `--all-features` can never
# compile. Each job therefore builds/lints/tests one feature at a time via a matrix.
# `nnue` is `x86_64`-only, which is satisfied by `ubuntu-latest`.

on: [push, pull_request]

name: Quickstart

# Tournament config TOML: the matrix uses configs/ci.toml (small TT); the production config gets a compile-only proof in check-production-config below.
# YORKIE_NUMA_RESERVE: 0 keeps the whole core set assignable on the small `numa`-job runners.
env:
  YORKIE_TOURNAMENT_CONFIG: configs/ci.toml
  YORKIE_NUMA_RESERVE: 0

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # `cargo fmt --check` is feature-independent, so run it once.
      - name: Run cargo fmt
        run: cargo fmt --all -- --check

  check:
    name: Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        feature:
          [
            material,
            nnue,
            "nnue,mate",
            "nnue,tournament",
            "nnue,tournament,emit-nps",
            "material,tournament",
            "material,tournament,emit-nps",
            "material,numa",
            "nnue,numa",
          ]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Run cargo check
        run: cargo check --all-targets --no-default-features --features ${{ matrix.feature }}

  # Compile-only proof for the production tournament config (configs/tsec7-part1.toml): `cargo check` never allocates its huge baked TT, but a `cargo test` here would — never add one.
  check-production-config:
    name: Check production tournament config
    runs-on: ubuntu-latest
    env:
      YORKIE_TOURNAMENT_CONFIG: configs/tsec7-part1.toml
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run cargo check (production config)
        run: cargo check --all-targets --no-default-features --features nnue,tournament

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        feature:
          [
            material,
            nnue,
            "nnue,mate",
            "nnue,tournament",
            "nnue,tournament,emit-nps",
            "material,tournament",
            "material,tournament,emit-nps",
            "material,numa",
            "nnue,numa",
          ]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Run cargo test
        run: cargo test --no-default-features --features ${{ matrix.feature }}

  lints:
    name: Lints
    runs-on: ubuntu-latest
    strategy:
      matrix:
        feature:
          [
            material,
            nnue,
            "nnue,mate",
            "nnue,tournament",
            "nnue,tournament,emit-nps",
            "material,tournament",
            "material,tournament,emit-nps",
            "material,numa",
            "nnue,numa",
          ]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Run cargo clippy
        run: cargo clippy --all-targets --no-default-features --features ${{ matrix.feature }} -- -D warnings
