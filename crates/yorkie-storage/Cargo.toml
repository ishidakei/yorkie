[package]
name = "yorkie-storage"
version.workspace = true
edition.workspace = true
publish = false

# Storage layer: a substrate that may depend on std and utility crates only, and
# must not import any other workspace crate. The transposition table therefore
# speaks in primitives rather than State-layer types, and the Search layer, which
# owns both, adapts between them.
[dependencies]

# The process-wide `#[global_allocator]`; `src/allocator.rs` says why the
# declaration lives here rather than in the binary root. Its transitive
# `libmimalloc-sys` builds vendored C sources, so a C compiler is needed on the
# build host.
mimalloc = "0.1"

# Unix-only: `madvise(MADV_HUGEPAGE)` over a large-page block and over the
# transposition table's `static`, mirroring the reference's
# `aligned_large_pages_alloc`. The call is Linux-gated in code; the dependency is
# `cfg(unix)`-gated so non-Unix targets never pull it in.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# `tt-entry16` widens the transposition-table entry from the reference's 10 bytes
# to 16, spending the whole increase on the key: the stored `u16` key fragment
# becomes the whole `u64` hash, so an entry's identity is exact instead of
# ~1/65536-false-positive. The payload fields are untouched.
#
# The cluster stays 32 bytes and therefore holds 2 entries instead of 3; the TT
# sizing arithmetic and index computation are unchanged.
#
# Off by default. With it on the probe-hit pattern changes, so search output
# matches neither the default build's nor the reference's.
#
# `verbose1`, `verbose2` and `verbose3` are the Protocol layer's verbosity
# features, propagated down so the parts of this crate that exist only to be
# printed or inspected under one of them are gated here rather than left to the
# optimizer:
#
#   - `verbose1` — the counting global allocator and the process-wide tally it
#     raises, which the per-reply statistics line reports. Without it the
#     `#[global_allocator]` is mimalloc itself, and neither the wrapper type nor
#     the counter is compiled. It also adds the store's report back to the
#     storing thread — a count it raises when the payload is written — and the
#     check whether an entry already holds a position's static eval, both of
#     which feed the same line.
#   - `verbose2` — the occupancy statistic the search `info` lines carry, so
#     without it the crate compiles without `TranspositionTable::hashfull` at
#     all.
#   - `verbose3` — the per-entry value marks the statistics line's marks are
#     carried through.
#
# They keep the implication chain of the Protocol layer, and all are off by
# default. None changes anything else about the table.
#
# `dupstats` is the measuring feature that counts how parallel search workers
# repeat each other's work. Here it adds one read: the depth an entry holds a
# position at and whether the running search wrote it, which a store looks at
# before it writes. It implies `verbose1` and is off by default.
[features]
tt-entry16 = []
verbose1 = []
verbose2 = ["verbose1"]
verbose3 = ["verbose2"]
dupstats = ["verbose1"]

[lints]
workspace = true
