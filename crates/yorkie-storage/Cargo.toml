[package]
name = "yorkie-storage"
version.workspace = true
edition.workspace = true
publish = false

# Storage layer. Dependency rules: Storage is a substrate
# — it may depend on std + utility crates only, and MUST NOT import
# yorkie-state, yorkie-eval, yorkie-search, or yorkie-protocol. The
# transposition table therefore speaks in primitives (u64 key, u16 move
# fragment, i32 value/depth, a local Bound enum) rather than State-layer types;
# the Search layer, which owns both, adapts between them.
[dependencies]

# The process-wide `#[global_allocator]` (see `src/allocator.rs` for why the
# declaration lives in this crate rather than in the `yorkie` binary root).
# Default features only: `secure` is deliberately off, and no mimalloc options
# are tuned. MIT, crates.io — as is its transitive `libmimalloc-sys`, which
# builds the vendored C sources and therefore needs a C compiler on the build
# host.
mimalloc = "0.1"

# Unix-only: `madvise(MADV_HUGEPAGE)` over the transposition-table allocation
# (see `src/tt.rs`), mirroring the reference's `aligned_large_pages_alloc`. The
# call itself is Linux-gated in code; the dependency is `cfg(unix)`-gated so
# non-Unix targets never pull it in.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
