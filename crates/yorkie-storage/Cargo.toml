[package]
name = "yorkie-storage"
version.workspace = true
edition.workspace = true
publish = false

# Storage layer: a substrate that may depend on std and utility crates only, and
# must not import any other workspace crate. The transposition table therefore
# speaks in primitives rather than State-layer types, and the Search layer, which
# owns both, adapts between them.
[dependencies]

# The process-wide `#[global_allocator]`; `src/allocator.rs` says why the
# declaration lives here rather than in the binary root. Its transitive
# `libmimalloc-sys` builds vendored C sources, so a C compiler is needed on the
# build host.
mimalloc = "0.1"

# Unix-only: `madvise(MADV_HUGEPAGE)` over the transposition-table allocation,
# mirroring the reference's `aligned_large_pages_alloc`. The call is Linux-gated
# in code; the dependency is `cfg(unix)`-gated so non-Unix targets never pull it
# in.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# `tt-entry16` widens the transposition-table entry from the reference's 10 bytes
# to 16, spending the whole increase on the key: the stored `u16` key fragment
# becomes the whole `u64` hash, so an entry's identity is exact instead of
# ~1/65536-false-positive. The payload fields are untouched.
#
# The cluster stays 32 bytes and therefore holds 2 entries instead of 3; the TT
# sizing arithmetic and index computation are unchanged.
#
# Off by default. With it on the probe-hit pattern changes, so search output
# matches neither the default build's nor the reference's.
[features]
tt-entry16 = []

[lints]
workspace = true
