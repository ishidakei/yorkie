[package]
name = "yorkie"
version.workspace = true
edition.workspace = true
publish = false

# The `[[test]]` below is not auto-discovered, since it lives one directory down.
[[test]]
name = "parity_perft"
path = "tests/parity/perft.rs"

[dependencies]
yorkie-protocol = { path = "../yorkie-protocol" }
yorkie-state = { path = "../yorkie-state" }

[dev-dependencies]
serde = { version = "~1.0", features = ["derive"] }
serde_json = "~1.0"

# Re-exports of the Protocol- and Storage-layer features, so a build of this
# binary can reach them. All are off by default: the tournament binary's only
# search output is `bestmove`, and the only `info string`s it can print are the
# initialisation-phase ones, which no feature gates. A measurement build — the
# one that reads `nodes` / `nps` back out of the transcript — wants `verbose3`,
# which drives `bench` and prints the search `info` lines its guards read.
[features]
verbose1 = ["yorkie-protocol/verbose1"]
verbose2 = ["yorkie-protocol/verbose2"]
verbose3 = ["yorkie-protocol/verbose3"]
tt-entry16 = ["yorkie-protocol/tt-entry16"]

[lints]
workspace = true
