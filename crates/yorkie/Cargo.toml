[package]
name = "yorkie"
version.workspace = true
edition.workspace = true
publish = false

# The `[[test]]` below is not auto-discovered, since it lives one directory down.
[[test]]
name = "parity_perft"
path = "tests/parity/perft.rs"

# The CSA server-protocol client: a binary of its own, so that `yorkie` stays the
# USI engine in every build, the `--all-features` test run included, and the
# client binary never reads USI. Built only with `csa`.
[[bin]]
name = "yorkie-csa"
path = "src/bin/yorkie-csa.rs"
required-features = ["csa"]

[dependencies]
yorkie-protocol = { path = "../yorkie-protocol" }
yorkie-state = { path = "../yorkie-state" }

[dev-dependencies]
serde = { version = "~1.0", features = ["derive"] }
serde_json = "~1.0"

# The tests that spawn the binary ask where its evaluation file is and whether
# this build had a network to write one from; the Evaluation layer answers both.
yorkie-eval = { path = "../yorkie-eval" }

# Re-exports of the Protocol- and Storage-layer features, so a build of this
# binary can reach them. All are off by default: the tournament binary's only
# search output is `bestmove`, and the only `info string`s it can print are the
# initialisation-phase ones, which no feature gates. A measurement build — the
# one that reads `nodes` / `nps` back out of the transcript — wants `verbose3`,
# which drives `bench` and prints the search `info` lines its guards read.
# `dupstats` adds the counts of how parallel search workers repeat each other's
# work to the statistics line; it slows the search, so a build measuring time to
# depth leaves it off. `csa` adds the `yorkie-csa` binary, a client of the CSA
# server protocol.
[features]
csa = ["yorkie-protocol/csa"]
dupstats = ["yorkie-protocol/dupstats"]
verbose1 = ["yorkie-protocol/verbose1"]
verbose2 = ["yorkie-protocol/verbose2"]
verbose3 = ["yorkie-protocol/verbose3"]
tt-entry16 = ["yorkie-protocol/tt-entry16"]
random = ["yorkie-protocol/random"]

[lints]
workspace = true
