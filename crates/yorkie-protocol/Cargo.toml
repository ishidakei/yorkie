[package]
name = "yorkie-protocol"
version.workspace = true
edition.workspace = true
publish = false

# Protocol layer: may import Search, Storage and State, never Evaluation
# directly.
[dependencies]
# The Evaluation layer, for the evaluation file itself: where it is, how big the
# memory holding it is, and which of the two ways of holding it the host the
# build ran on calls for. The searching it feeds is reached through the Search
# layer.
yorkie-eval = { path = "../yorkie-eval" }
yorkie-numa = { path = "../yorkie-numa" }
yorkie-search = { path = "../yorkie-search" }
yorkie-state = { path = "../yorkie-state" }
yorkie-storage = { path = "../yorkie-storage" }

# The build script reads the building machine's NUMA layout and L3 domains with
# the same code the engine would have read them with, and compiles the result in.
# `libc` is for the `flock` that makes the CPU ledger safe against two builds
# running at once on one machine.
[build-dependencies]
libc = "0.2"
yorkie-numa = { path = "../yorkie-numa" }

# `libc` is here for the same reason it is a build dependency: the CPU-assignment
# tests `include!` the build script's half of it, `flock` and all.
[dev-dependencies]
libc = "0.2"
serde = { version = "~1.0", features = ["derive"] }
serde_json = "~1.0"

# One axis decides how much of the USI surface a build reads and prints. Each
# feature contains the one before it, and a build with no verbosity feature is
# the tournament build, so there is no `verbose0`:
#
#   - no feature — the tournament build: the commands a rated game issues, and
#     `bestmove` plus the initialisation-phase `info string`s as its only output.
#     Those initialisation lines are how a failed startup is diagnosed at all, so
#     they are emitted in every build.
#   - `verbose1` — adds the diagnostic `info string` lines emitted outside the
#     initialisation phase.
#   - `verbose2` — adds the search `info` lines, and the non-match `go` clauses
#     (`depth` / `nodes` / `mate` / `movetime` / `infinite` / `rtime`) an
#     analysis mode needs.
#   - `verbose3` — adds `bench`, and the value marks on the per-reply
#     statistics line.
#
# `bench` disappears as a command token without `verbose3`. The gated `go`
# clauses cannot disappear the same way, since `go` itself is a match command, so
# without `verbose2` a `go` line carrying one is *rejected* and starts no search
# — silently ignoring the clause would turn `go depth 4` into an unbounded,
# clock-less search mid-game. The refusal happens in every build; `verbose1` is
# where it is also reported.
#
# The `bench` summary line is not a diagnostic but the response payload of a
# `verbose3` command, so it rides on that feature alone and no `info` line is
# involved in gating it.
#
# Each feature also turns on the feature of the same name in every lower layer
# that has one, because the output it brings is not all produced here: what a
# build prints, and everything that exists only to compute it, is gated on the
# same feature in whichever crate it lives, rather than left for the optimizer to
# discard.
#
#   - `verbose1` → `yorkie-search/verbose1` — the book probe's diagnostic
#     message bodies and each worker's search counts — and
#     `yorkie-storage/verbose1` — the counting global allocator and the
#     transposition table's report of a written entry, both behind the per-reply
#     statistics line.
#   - `verbose2` → `yorkie-search/verbose2` (and through it
#     `yorkie-storage/verbose2`) — the PV-output surface, the root moves' fail
#     bounds, the book hit's per-candidate lines, and the transposition table's
#     `hashfull` occupancy.
#   - `verbose3` → `yorkie-search/verbose3` and `yorkie-storage/verbose3` — the
#     value marks the statistics line reports, which the search carries on its
#     return path and the transposition table keeps per entry.
#
# `tt-entry16` is the Storage-layer entry-widening feature, re-exported so the
# binary crate can reach it. Off by default, and orthogonal to the verbosity
# axis.
#
# `random` is the Search-layer evaluation-noise feature, likewise orthogonal.
# This crate owns the `random` setting the amplitude comes from and the per-game
# seed the search is handed, so the constant, the seed and its hand-over are all
# behind the feature here too. Off by default.
#
# `tune` is the Search-layer feature that makes the search parameters settable
# at startup, likewise orthogonal. This crate reads the `YORKIE_TUNE` environment
# variable they are set from, behind the feature. Off by default.
#
# `dupstats` is the Search-layer measuring feature that counts how parallel
# search workers repeat each other's work. It implies `verbose1`: this crate sums
# the workers' counts into the per-reply statistics line, and with `verbose3`
# the `bench` command also writes their full histograms after its summary. Off
# by default; a build with it searches more slowly than one without.
#
# `lazy-smp-spread` compiles in the parallel workers' move-order spread (the
# Search layer's `spread` module) and the three counts this crate writes for it
# on the statistics line, without turning the spread on: a worker spreads only
# when the config's `lazy_smp_spread` is true and the build has more than one
# worker. The config key alone compiles the same code in; the feature is how
# the tests reach it under a config that leaves the key off. Off by default.
[features]
lazy-smp-spread = ["yorkie-search/lazy-smp-spread"]
verbose1 = ["yorkie-search/verbose1", "yorkie-storage/verbose1"]
verbose2 = ["verbose1", "yorkie-search/verbose2"]
verbose3 = ["verbose2", "yorkie-search/verbose3", "yorkie-storage/verbose3"]
tt-entry16 = ["yorkie-search/tt-entry16", "yorkie-storage/tt-entry16"]
random = ["yorkie-search/random"]
tune = ["yorkie-search/tune"]
dupstats = ["verbose1", "yorkie-search/dupstats", "yorkie-storage/dupstats"]

[lints]
workspace = true
