[package]
name = "yorkie-protocol"
version.workspace = true
edition.workspace = true
publish = false

# Protocol layer: may import Search, Storage and State, never Evaluation
# directly.
[dependencies]
yorkie-numa = { path = "../yorkie-numa" }
yorkie-search = { path = "../yorkie-search" }
yorkie-state = { path = "../yorkie-state" }
yorkie-storage = { path = "../yorkie-storage" }

[dev-dependencies]
serde = { version = "~1.0", features = ["derive"] }
serde_json = "~1.0"

# One axis decides how much of the USI surface a build reads and prints. Each
# feature contains the one before it, and a build with no verbosity feature is
# the tournament build, so there is no `verbose0`:
#
#   - no feature — the tournament build: the commands a rated game issues, and
#     `bestmove` plus the initialisation-phase `info string`s as its only output.
#     Those initialisation lines are how a failed startup is diagnosed at all, so
#     they are emitted in every build.
#   - `verbose1` — adds the diagnostic `info string` lines emitted outside the
#     initialisation phase.
#   - `verbose2` — adds the search `info` lines, and the non-match `go` clauses
#     (`depth` / `nodes` / `mate` / `movetime` / `infinite` / `rtime`) an
#     analysis mode needs.
#   - `verbose3` — adds `tt store` / `tt probe` / `tt children` and `bench`.
#
# `tt` and `bench` disappear as command tokens without `verbose3`. The gated `go`
# clauses cannot disappear the same way, since `go` itself is a match command, so
# without `verbose2` a `go` line carrying one is *rejected* and starts no search
# — silently ignoring the clause would turn `go depth 4` into an unbounded,
# clock-less search mid-game. The refusal happens in every build; `verbose1` is
# where it is also reported.
#
# The `tt` command family and the `bench` summary line are not diagnostics but
# the response payload of a `verbose3` command, so they ride on that feature
# alone and no `info` line is involved in gating them.
#
# Each feature also turns on the feature of the same name in every lower layer
# that has one, because the output it brings is not all produced here: what a
# build prints, and everything that exists only to compute it, is gated on the
# same feature in whichever crate it lives, rather than left for the optimizer to
# discard.
#
#   - `verbose1` → `yorkie-search/verbose1` — the book probe's diagnostic
#     message bodies.
#   - `verbose2` → `yorkie-search/verbose2` (and through it
#     `yorkie-storage/verbose2`) — the PV-output surface, the root moves' fail
#     bounds, the book hit's per-candidate lines, and the transposition table's
#     `hashfull` occupancy.
#   - `verbose3` → `yorkie-search/verbose3` and `yorkie-storage/verbose3` — the
#     per-entry path-dependence mark the `tt` commands read and write, and
#     `TranspositionTable::checksum`, which serves the table-inspection commands
#     and has no in-game reader.
#
# `tt-entry16` is the Storage-layer entry-widening feature, re-exported so this
# crate's session tests can `cfg` on it. Off by default, and orthogonal to the
# verbosity axis.
#
# `random` is the Search-layer evaluation-noise feature, likewise orthogonal.
# This crate owns the `random` setting the amplitude comes from and the per-game
# seed the search is handed, so the constant, the seed and its hand-over are all
# behind the feature here too. Off by default.
[features]
verbose1 = ["yorkie-search/verbose1"]
verbose2 = ["verbose1", "yorkie-search/verbose2"]
verbose3 = ["verbose2", "yorkie-search/verbose3", "yorkie-storage/verbose3"]
tt-entry16 = ["yorkie-search/tt-entry16", "yorkie-storage/tt-entry16"]
random = ["yorkie-search/random"]

[lints]
workspace = true
