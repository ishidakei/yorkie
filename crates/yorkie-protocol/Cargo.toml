[package]
name = "yorkie-protocol"
version.workspace = true
edition.workspace = true
publish = false

# Protocol layer: may import Search, Storage and State, never Evaluation
# directly.
[dependencies]
yorkie-numa = { path = "../yorkie-numa" }
yorkie-search = { path = "../yorkie-search" }
yorkie-state = { path = "../yorkie-state" }
yorkie-storage = { path = "../yorkie-storage" }

[dev-dependencies]
serde = { version = "~1.0", features = ["derive"] }
serde_json = "~1.0"

# `usi-extras` is the umbrella feature for USI commands a tournament game never
# issues: the `tt` family, `bench`, and the non-match `go` clauses (`depth` /
# `nodes` / `mate` / `movetime` / `infinite` / `rtime`). Off by default, so the
# tournament binary does not contain them at all.
#
# `tt` and `bench` disappear as command tokens with the feature off. The gated
# `go` clauses cannot disappear the same way, since `go` itself is a match
# command, so a `go` line carrying one is *rejected* with an `info string` and
# starts no search — silently ignoring the clause would turn `go depth 4` into an
# unbounded, clock-less search mid-game.
#
# `tt-entry16` is the Storage-layer entry-widening feature, re-exported so this
# crate's session tests can `cfg` on it. Off by default, and independent of
# `usi-extras`.
#
# The default build emits no `info` line at all except the initialisation-phase
# `info string`s, which are how a failed startup is diagnosed and are
# unconditional in every build. On top of that:
#
#   - `info-diag` restores the diagnostic `info string` lines emitted outside the
#     initialisation phase.
#   - `info-output` restores the search `info` lines, and implies `info-diag`.
#
# The `tt` command family and the `bench` summary line are not diagnostics but
# the response payload of a `usi-extras` command, so they ride on that feature
# alone.
[features]
usi-extras = []
tt-entry16 = ["yorkie-search/tt-entry16", "yorkie-storage/tt-entry16"]
info-diag = []
info-output = ["info-diag"]

[lints]
workspace = true
