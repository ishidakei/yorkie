[package]
name = "yorkie-numa"
version.workspace = true
edition.workspace = true
publish = false

# NUMA topology discovery, a port of the reference's `NumaConfig` machinery
# (`numa.h`). Depends on std, plus `libc` on Linux for the affinity and
# memory-policy syscalls. All sysfs topology parsing is pure and takes an
# injectable root path, so it is exercised against fixture directories.
[dependencies]

# Every syscall here is Linux-gated in code; the dependency is
# `cfg(target_os = "linux")`-gated so other targets never pull it in. The
# non-Linux paths fall back to "all system threads" and no-op placement.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[lints]
workspace = true
