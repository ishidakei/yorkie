[package]
name = "yorkie-search"
version.workspace = true
edition.workspace = true
publish = false

# Search layer: may depend on Evaluation and State, never on Protocol. It also
# owns the Storage layer's transposition table, and with it the widening and
# validation of stored moves against a `Position`.
[dependencies]
yorkie-eval = { path = "../yorkie-eval" }
yorkie-state = { path = "../yorkie-state" }
yorkie-storage = { path = "../yorkie-storage" }

[dev-dependencies]
serde = { version = "~1.0", features = ["derive"] }
serde_json = "~1.0"

# Re-exported from the Storage layer so this crate's code and tests can `cfg` on
# it: the wide TT changes which probes hit, so the reference-captured parity
# gates cannot hold and are compiled out under it. Off by default.
#
# `verbose1`, `verbose2` and `verbose3` are the Protocol layer's verbosity
# features, propagated down (and on to the Storage layer) so everything this
# crate computes only to be printed under one of them is absent from the compiled
# crate without that feature rather than merely unused:
#
#   - `verbose1` — the book probe's diagnostic message bodies, which the Protocol
#     layer turns into `info string` lines.
#   - `verbose2` — everything behind a search `info` line: the PV-output sink,
#     configuration and line assembly, the root moves' fail-bound flags, the book
#     hit's per-candidate lines, and the transposition table's `hashfull`
#     occupancy the Storage layer supplies.
#   - `verbose3` — the per-entry path-dependence mark a `tt probe` reports: the
#     bit the search carries on its return path, and the propagation that
#     maintains it.
#
# Each implies the one before it, as on the Protocol layer. All are off by
# default.
#
# `random` is orthogonal to that axis and composes with any of them: it makes the
# static evaluation carry a per-position noise term drawn from a per-game seed,
# so the engine's play varies between games while staying self-consistent within
# one. The whole of it — the amplitude, the seed, the noise function and the
# branch that adds it — is behind the feature, and a build without it evaluates
# exactly as before. Off by default.
[features]
random = []
tt-entry16 = ["yorkie-storage/tt-entry16"]
verbose1 = []
verbose2 = ["verbose1", "yorkie-storage/verbose2"]
verbose3 = ["verbose2", "yorkie-storage/verbose3"]

[lints]
workspace = true
