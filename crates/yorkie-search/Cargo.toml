[package]
name = "yorkie-search"
version.workspace = true
edition.workspace = true
publish = false

# Search layer: may depend on Evaluation and State, never on Protocol. It also
# owns the Storage layer's transposition table, and with it the widening and
# validation of stored moves against a `Position`.
[dependencies]
yorkie-eval = { path = "../yorkie-eval" }
yorkie-state = { path = "../yorkie-state" }
yorkie-storage = { path = "../yorkie-storage" }

[dev-dependencies]
serde = { version = "~1.0", features = ["derive"] }
serde_json = "~1.0"

# Re-exported from the Storage layer so this crate's code and tests can `cfg` on
# it: the wide TT changes which probes hit, so the reference-captured parity
# gates cannot hold and are compiled out under it. Off by default.
[features]
tt-entry16 = ["yorkie-storage/tt-entry16"]

[lints]
workspace = true
