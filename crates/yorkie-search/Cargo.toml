[package]
name = "yorkie-search"
version.workspace = true
edition.workspace = true
publish = false

# Search layer: may depend on Evaluation and State, never on Protocol. It also
# owns the Storage layer's transposition table, and with it the widening and
# validation of stored moves against a `Position`.
[dependencies]
yorkie-eval = { path = "../yorkie-eval" }
yorkie-state = { path = "../yorkie-state" }
yorkie-storage = { path = "../yorkie-storage" }

[dev-dependencies]
serde = { version = "~1.0", features = ["derive"] }
serde_json = "~1.0"

# Re-exported from the Storage layer so this crate's code and tests can `cfg` on
# it: the wide TT changes which probes hit, so the reference-captured parity
# gates cannot hold and are compiled out under it. Off by default.
#
# `verbose1` and `verbose2` are the Protocol layer's verbosity levels, propagated
# down (and on to the Storage layer) so everything this crate computes only to be
# printed at one of them is absent from the compiled crate below that level
# rather than merely unused:
#
#   - `verbose1` — the book probe's diagnostic message bodies, which the Protocol
#     layer turns into `info string` lines.
#   - `verbose2` — everything behind a search `info` line: the PV-output sink,
#     configuration and line assembly, the root moves' fail-bound flags, the book
#     hit's per-candidate lines, and the transposition table's `hashfull`
#     occupancy the Storage layer supplies.
#
# Each level implies the one below it, as on the Protocol layer. Both are off by
# default.
[features]
tt-entry16 = ["yorkie-storage/tt-entry16"]
verbose1 = []
verbose2 = ["verbose1", "yorkie-storage/verbose2"]

[lints]
workspace = true
