[package]
name = "yorkie-search"
version.workspace = true
edition.workspace = true
publish = false

# Search layer: may depend on Evaluation and State, never on Protocol. It also
# owns the Storage layer's transposition table, and with it the widening and
# validation of stored moves against a `Position`.
[dependencies]
yorkie-eval = { path = "../yorkie-eval" }
yorkie-state = { path = "../yorkie-state" }
yorkie-storage = { path = "../yorkie-storage" }

[dev-dependencies]
serde = { version = "~1.0", features = ["derive"] }
serde_json = "~1.0"

# The tests stand a network up in memory rather than reading the one the build
# laid out, which is what the Evaluation layer's builder is for. It is off in
# the build that plays, so the tests ask for it here.
yorkie-eval = { path = "../yorkie-eval", features = ["source-network"] }

# Re-exported from the Storage layer so this crate's code and tests can `cfg` on
# it: the wide TT changes which probes hit, so the reference-captured parity
# gates cannot hold and are compiled out under it. Off by default.
#
# `verbose1`, `verbose2` and `verbose3` are the Protocol layer's verbosity
# features, propagated down (and on to the Storage layer) so everything this
# crate computes only to be printed under one of them is absent from the compiled
# crate without that feature rather than merely unused:
#
#   - `verbose1` — the book probe's diagnostic message bodies, which the Protocol
#     layer turns into `info string` lines, the book a hit came from, which it
#     names in one, and each worker's counts of the
#     transposition-table stores that wrote an entry and of the static-eval
#     stores that found the position's eval already there, which the per-reply
#     statistics line reports.
#   - `verbose2` — everything behind a search `info` line: the PV-output sink,
#     configuration and line assembly, the root moves' fail-bound flags, the book
#     hit's per-candidate lines, and the transposition table's `hashfull`
#     occupancy the Storage layer supplies.
#   - `verbose3` — the value marks the per-reply statistics line reports: the
#     bits the search carries on its return path, and the propagation that
#     maintains them.
#
# Each implies the one before it, as on the Protocol layer. All are off by
# default.
#
# `random` is orthogonal to that axis and composes with any of them: it makes the
# static evaluation carry a per-position noise term drawn from a per-game seed,
# so the engine's play varies between games while staying self-consistent within
# one. The whole of it — the amplitude, the seed, the noise function and the
# branch that adds it — is behind the feature, and a build without it evaluates
# exactly as before. Off by default.
#
# `tune` is orthogonal too: it turns the search parameters `params` registers
# from constants into statics written once at startup from a tuning list, so a
# tuning run can vary them without a rebuild. A `tune` build given no list
# searches exactly as the build without it. Off by default.
#
# `dupstats` is a measuring feature: it counts where and how much parallel
# search workers repeat each other's work (the `dupstats` module), using two
# statistics-only tables beside the transposition table, and what each worker's
# search does with the table and in its move loop: the shallower stores that
# overwrite deeper entries, the table cutoffs, the singular extensions and where
# a beta cutoff comes. It changes no search
# decision unless the `YORKIE_DUPSTATS_CUT` environment variable names a switch
# of `yorkie-storage`'s `cut` module (a worker's own correction or pawn table,
# or a use of a table entry withheld from the main worker), but the tables cost
# memory traffic, so a build with it is slower
# than one without and its timings are not comparable with theirs. It also
# keeps each worker's record of when it finished each root iteration (the
# `timeline` module) and, when the `YORKIE_DUPSTATS_LOG` environment variable
# names a file, appends to it what each worker took from the table and how its
# root searches went (the `channels` module); with `verbose3` the latch a measurement uses to end a
# search at its first worker to finish. It implies `verbose1`, whose statistics
# line carries its totals. Off by default.
#
# `lazy-smp-spread` compiles in the move-order spread of the `spread` module
# without turning it on. The config key `lazy_smp_spread` compiles the same code
# in and turns it on for a build with more than one worker; without either, none
# of it exists in the crate. The feature is how the tests reach the code under a
# config that leaves the key off: they turn a worker's spread on themselves.
# Off by default.
#
# `lazy-smp-defer` compiles in the `defer` module, by which a worker puts off a
# move another worker is searching, without turning it on. The config key
# `lazy_smp_defer` compiles the same code in and turns it on for a build with
# more than one worker; without either, none of it exists in the crate. The
# feature is how the tests reach the code under a config that leaves the key
# off. Off by default.
#
# `repetition-index` compiles in each worker's index of the game before its
# search root, and the repetition judgement that reads it, without widening
# the look-back window. A config key `repetition_look_back` other than `16`
# compiles the same code in and sets the window; without either, the search
# judges a repetition with the plain sixteen-ply walk alone. The feature is how
# the tests reach the code under a config that keeps `16`: they set a
# worker's window themselves. Off by default.
[features]
lazy-smp-defer = []
lazy-smp-spread = []
random = []
repetition-index = []
tune = []
tt-entry16 = ["yorkie-storage/tt-entry16"]
verbose1 = ["yorkie-storage/verbose1"]
verbose2 = ["verbose1", "yorkie-storage/verbose2"]
verbose3 = ["verbose2", "yorkie-state/verbose3", "yorkie-storage/verbose3"]
dupstats = ["verbose1", "yorkie-storage/dupstats"]

[lints]
workspace = true
