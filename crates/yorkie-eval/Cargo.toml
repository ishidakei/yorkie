[package]
name = "yorkie-eval"
version.workspace = true
edition.workspace = true
publish = false

# Evaluation layer. Dependency rules: Evaluation may import State and Storage,
# never Protocol or Search. Feature extraction reads the board/hands off
# `yorkie-state::Position`; the loaded feature-transformer weights are backed by
# the Storage layer's shared huge-page allocator (`yorkie-storage::LargePageArray`).
[dependencies]
yorkie-state = { path = "../yorkie-state" }
yorkie-storage = { path = "../yorkie-storage" }

[dev-dependencies]
proptest = "~1.11"
serde_json = "~1.0"
