[workspace]
resolver = "2"
members = ["crates/yorkie", "crates/yorkie-eval", "crates/yorkie-numa", "crates/yorkie-protocol", "crates/yorkie-search", "crates/yorkie-state", "crates/yorkie-storage", "crates/xtask"]

[workspace.package]
edition = "2024"
# One version for every workspace member. The number is this project's own
# generation number, matching `CHANGELOG.md`; it does not encode the upstream
# YaneuraOu baseline the port tracks, which `README.md` documents instead. The
# USI `id name` derives from it.
version = "3.1.0"

# The lint only sees workspace members, so vendored non-member sources are out of
# its reach by construction, and it leaves the `tests/<name>/mod.rs`
# integration-test helper form alone. If a future clippy tightens that, add
# `#![allow(clippy::mod_module_files)]` to the test roots rather than dropping
# the lint.
[workspace.lints.clippy]
mod_module_files = "warn"

# Build scripts are optimised in every profile. One of them decodes the whole
# network and lays it out for the kernels, which is a few hundred megabytes of
# arithmetic: unoptimised, that turns a build into a coffee break, and the code
# doing it ships in nothing.
[profile.dev.build-override]
opt-level = 2
[profile.release.build-override]
opt-level = 2

# Fat LTO and a single codegen unit trade link time for run-time speed.
# `panic = "abort"` matches the reference build, which is compiled
# `-fno-exceptions -fno-rtti`: it strips unwind edges, cleanup landing pads and
# `drop_in_place` chains from the hot search code, shrinking the text segment.
# Cargo ignores `panic` when building test targets, so `cargo test --release`
# keeps unwinding and works unchanged. `strip` stays unset, since perf work needs
# symbols.
#
# `debug` carries the line table, which is what maps a hot instruction back to
# the line that produced it under `objdump -dS` and `perf annotate`. Line tables
# alone, rather than `true`: full debug info makes the optimiser lay the text
# segment out differently, and the point here is a release binary whose code is
# the code that runs in a game. DWARF is never loaded at run time, so it costs
# the running engine nothing; it only makes the file larger, and
# `strip --strip-debug` takes it back out of a binary being handed to a
# tournament machine.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
debug = "line-tables-only"

# The allocator's build script reads cargo's `DEBUG` and, when it is set, stops
# defining `NDEBUG` and `MI_BUILD_RELEASE` for the vendored C sources — which
# would leave the allocator's assertions compiled into a tournament binary. It
# gets the line tables the profile above asks for only over the Rust code.
[profile.release.package.libmimalloc-sys]
debug = false
