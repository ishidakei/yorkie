[package]
name = "yorkie"
version = "0.0.1"
authors = ["Kei Ishida <ishida.kei@gmail.com>"]
edition = "2024"
rust-version = "1.96.0"

[dependencies]
anyhow = "1.0.86"
arrayvec = "0.7.4"
# NUMA-only deps (pulled in solely by the additive `numa` feature; not built by the
# default / `material` / `nnue` / `kppt` builds). `core_affinity` wraps
# `sched_setaffinity` (#13); `libc` provides `mmap`/`mbind`/`madvise` (#12).
core_affinity = { version = "0.8", optional = true }
custom_derive = "0.1.7"
derive_more = "0.99.18"
enum_derive = "0.1.7"
libc = { version = "0.2", optional = true }
mimalloc = "0.1.52"
num = "0.4.3"
once_cell = "1.19.0"
rand = "0.8.5"
rayon = "1.10.0"
regex = "1.10.5"
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
static_assertions = "1.1.0"
thiserror = "1.0.61"
# Mate-search-only dep (pulled in solely by the `mate` feature; not built by tournament
# builds, which use `--no-default-features` without `mate`). Implements the USI `go mate`
# analysis query; never reached during normal play.
tsumeshogi-solver = { tag = "0.5.2", git = "https://github.com/sugyan/tsumeshogi-solver.git", optional = true }

# Build-only: parse configs/<event>.toml in build.rs to emit compile-time consts for the
# tournament build. Not linked into the engine binary; runtime behavior is unaffected.
[build-dependencies]
toml = "0.8"

[profile.release]
lto = true

[features]
default = ["nnue", "mate"]
material = []
nnue = []
# USI `go mate` mate-search support. Owns the optional `tsumeshogi-solver` dependency and
# all the mate-search code. In `default` so the standard dev build keeps mate, but NOT
# enabled for tournament builds (built with `--no-default-features`), so the tournament
# binary never links the solver. A build without `mate` answers `go mate` with
# `checkmate notimplemented` per the USI spec.
mate = ["dep:tsumeshogi-solver"]
# Additive tournament build (composes with an eval feature, e.g. `nnue,tournament`).
# When enabled, build.rs bakes startup-fixed values from the config TOML named by the
# `YORKIE_TOURNAMENT_CONFIG` env var (e.g. configs/tsec7-part1.toml) into compile-time
# consts that hot paths read instead of the runtime USI options. Off by default so
# development and per-run value sweeps keep the runtime options.
tournament = []
# Additive NUMA build (Linux-only; composes with an eval feature, e.g. `nnue,numa`).
# When enabled the engine (a) pins each search worker thread to a CPU core
# compact-by-node and (b) gives each thread a node-local replica of the NNUE network,
# read on the eval hot path instead of the shared global. Off by default = today's
# behavior exactly. Pulls in `core_affinity` + `libc` only when enabled.
numa = ["dep:core_affinity", "dep:libc"]
