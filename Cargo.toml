[workspace]
resolver = "2"
members = ["crates/yorkie", "crates/yorkie-eval", "crates/yorkie-numa", "crates/yorkie-protocol", "crates/yorkie-search", "crates/yorkie-state", "crates/yorkie-storage", "crates/xtask"]

[workspace.package]
edition = "2024"
# One version for every workspace member. The number is this project's own
# generation number, matching `CHANGELOG.md`; it does not encode the upstream
# YaneuraOu baseline the port tracks, which `README.md` documents instead. The
# USI `id name` derives from it.
version = "3.1.0"

# The lint only sees workspace members, so vendored non-member sources are out of
# its reach by construction, and it leaves the `tests/<name>/mod.rs`
# integration-test helper form alone. If a future clippy tightens that, add
# `#![allow(clippy::mod_module_files)]` to the test roots rather than dropping
# the lint.
[workspace.lints.clippy]
mod_module_files = "warn"

# Fat LTO and a single codegen unit trade link time for run-time speed.
# `panic = "abort"` matches the reference build, which is compiled
# `-fno-exceptions -fno-rtti`: it strips unwind edges, cleanup landing pads and
# `drop_in_place` chains from the hot search code, shrinking the text segment.
# Cargo ignores `panic` when building test targets, so `cargo test --release`
# keeps unwinding and works unchanged. `strip` stays unset, since perf work needs
# symbols.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
