[workspace]
resolver = "2"
members = ["crates/yorkie", "crates/yorkie-eval", "crates/yorkie-numa", "crates/yorkie-protocol", "crates/yorkie-search", "crates/yorkie-state", "crates/yorkie-storage", "crates/xtask"]

[workspace.package]
edition = "2024"
# One version for every workspace member. The number is this repository's
# generation number, matching `CHANGELOG.md`: `2.0.0` was the apery_rust-based
# generation and `3.0.0` is the current tree (this YaneuraOu Rust port). It does
# NOT encode the upstream YaneuraOu baseline the port tracks — that stays
# documented in `README.md`. The USI `id name` derives from it (`Yorkie 3.0.0`).
version = "3.0.0"

# Release profile is the standing build for benches, A/B NPS tables, and the
# eventual tournament binary — bake full optimization in so no manual RUSTFLAGS
# is ever required. Fat LTO + a single codegen unit trade link time for run-time
# speed (~+7% NPS measured together with `-C target-cpu=native` from
# `.cargo/config.toml`). `panic = "abort"` matches the reference build, which is
# compiled `-fno-exceptions -fno-rtti` (see `source/Makefile`):
# it strips unwind edges, cleanup landing pads and `drop_in_place` chains from the
# hot search code, shrinking the text segment (this machine is I-cache sensitive).
# Cargo ignores `panic` when building test targets, so `cargo test --release`
# keeps unwinding and works unchanged. `strip` stays unset — perf work needs
# symbols.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
