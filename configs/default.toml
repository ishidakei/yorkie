# The engine's compile-time configuration — the config the engine plays with,
# and the one a build reads when nothing selects another.
#
# The engine carries NO runtime configuration. Every setting below is read by
# `crates/yorkie-protocol/build.rs` at build time and emitted as a `pub const`
# into `yorkie_protocol::config`; every build reads those constants and nothing
# else. Changing a setting means rebuilding.
#
# Select a different config with the `YORKIE_CONFIG` environment variable, whose
# value is a path to a TOML file (relative paths resolve against the repository
# root):
#
#     YORKIE_CONFIG=configs/test.toml cargo nextest run --all-features
#
# Unset, the build reads this file, so `cargo build --release` on a fresh clone
# produces a binary ready to play.
#
# Format rules, enforced by the build script — every one of them is a hard build
# error, never a silent fallback:
#
#   * flat `key = value` pairs only; no `[table]` headers, no arrays;
#   * every key in the schema must be present, exactly once;
#   * no key outside the schema may appear;
#   * each value must have the declared type (integer / boolean / string) and
#     sit inside the declared range or choice list.
#
# Event-specific values — hash size, thread count, book selection, clock margins,
# sized against the machine the engine will actually run on — are written here,
# or into a copy of this file selected with `YORKIE_CONFIG`.
#
# `configs/test.toml` is the config the test suite runs against.

# ---------------------------------------------------------------------------
# Engine core
# ---------------------------------------------------------------------------

# Transposition-table size in MiB (USI option `USI_Hash`). Sized once, when a
# network first loads.
usi_hash = 1024

# Worker-pool size (`Threads`).
threads = 4

# Number of principal variations reported per search (`MultiPV`).
multi_pv = 1

# Directory holding `nn.bin` (`EvalDir`).
eval_dir = "eval"

# NNUE fixed-point output scale (`FV_SCALE`).
fv_scale = 16

# How the machine is mapped to logical NUMA nodes, and whether worker threads
# bind (`NumaPolicy`): `auto` / `system` / `hardware` / `none`, or a custom
# `':'`-separated node string.
numa_policy = "auto"

# Ponder toggles (`USI_Ponder` / `Stochastic_Ponder`). At the option layer these
# only feed the optimum-time bonus.
usi_ponder = false
stochastic_ponder = false

# ---------------------------------------------------------------------------
# Opening book
#
# `book_options_v2` selects which of the two book-option groups is live, the job
# `engine_option_profile.txt`'s `BOOK_OPTIONS` selector does in the reference
# implementation and that no build of this engine reads. `false` selects the V1
# surface; `true` swaps in the black/white-split filters.
#
# The V1-only and V2-only keys below are BOTH always present — the schema is one
# fixed key set — and the profile decides which half is live. A key the selected
# profile does not register reads as its type's zero (integer `0`, boolean
# `false`), exactly as an unregistered option does in the reference
# implementation. That is why `book_depth_white_limit` carries `5` (the V2
# default) while this file selects V1: under V1 it is inert.
# ---------------------------------------------------------------------------

book_options_v2 = false

# Consult the book at all (`USI_OwnBook`).
usi_own_book = true

# V1 only (`NarrowBook`): drop book moves played only once.
narrow_book = false

# Ply past which the book is no longer consulted (`BookMoves`).
book_moves = 16

# Percentage chance of ignoring the book on any one probe (`BookIgnoreRate`).
book_ignore_rate = 0

# Book file and directory (`BookFile` / `BookDir`). `no_book` is bookless; every
# other choice names a `.ybb` file, the only book format this engine reads.
book_file = "no_book"
book_dir = "book"

# V1 only (`BookEvalDiff`): reject a book move whose value trails the best book
# move's by more than this.
book_eval_diff = 30

# V2 only (`BookEvalBlackDiff` / `BookEvalWhiteDiff`): the same filter, split by
# the root side to move.
book_eval_black_diff = 0
book_eval_white_diff = 0

# Absolute value floor per root side to move (`BookEvalBlackLimit` /
# `BookEvalWhiteLimit`). Registered under both profiles.
book_eval_black_limit = 0
book_eval_white_limit = -140

# V1 only (`BookDepthLimit`): reject a book move searched shallower than this.
book_depth_limit = 16

# V2 only (`BookDepthBlackLimit` / `BookDepthWhiteLimit`): the same floor, split
# by the root side to move.
book_depth_black_limit = 0
book_depth_white_limit = 5

# Stream the book from disk instead of loading it into memory
# (`BookOnTheFly`). The V2 default is `true`; V1's is `false`.
book_on_the_fly = false

# V1 only (`ConsiderBookMoveCount`): weight book-move selection by play count.
consider_book_move_count = false

# How many book moves to emit as a PV (`BookPvMoves`).
book_pv_moves = 8

# Match book positions ignoring their recorded ply (`IgnoreBookPly`). The V2
# default is `true`; V1's is `false`.
ignore_book_ply = false

# Also probe the mirrored position (`FlippedBook`).
flipped_book = true

# ---------------------------------------------------------------------------
# Search behaviour
# ---------------------------------------------------------------------------

# Entering-king (nyugyoku) declaration rule (`EnteringKingRule`).
entering_king_rule = "CSARule27"

# Per-`go` depth / node ceilings, `0` meaning unlimited (`DepthLimit` /
# `NodesLimit`). An explicit `go depth` / `go nodes` token still wins, where the
# build has one.
depth_limit = 0
nodes_limit = 0

# Ply past which the search adjudicates an unconditional draw
# (`MaxMovesToDraw`); `0` is unlimited.
max_moves_to_draw = 0

# PV-output throttle in milliseconds, `0` meaning never suppress
# (`PvInterval`).
pv_interval = 300

# Collect each PV from the transposition table (`ConsiderationMode`), and emit a
# PV on a fail-high / fail-low (`OutputFailLHPV`).
consideration_mode = false
output_fail_lh_pv = true

# Per-colour draw score in centipawns, from each colour's own perspective
# (`DrawValueBlack` / `DrawValueWhite`).
draw_value_black = -2
draw_value_white = -2

# Resign when the centipawn-normalized best score is at or below `-this`
# (`ResignValue`). The default is effectively unreachable.
resign_value = 99999

# Also consider the non-promoting moves the default generator suppresses
# (`GenerateAllLegalMoves`).
generate_all_legal_moves = false

# ---------------------------------------------------------------------------
# Time management
# ---------------------------------------------------------------------------

# Average and worst-case GUI round-trip margins in milliseconds
# (`NetworkDelay` / `NetworkDelay2`). Subtracted from the clock so the search
# never overruns.
network_delay = 120
network_delay2 = 1120

# Floor on a move's optimum time in milliseconds, before the network delay is
# subtracted (`MinimumThinkingTime`).
minimum_thinking_time = 2000

# Percentage multiplier on the optimum time (`SlowMover`); 200 thinks twice as
# long.
slow_mover = 100

# Use the clock right up to each whole second (`RoundUpToFullSecond`).
round_up_to_full_second = true
