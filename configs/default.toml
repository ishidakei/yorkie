# The engine's compile-time configuration — the config the engine plays with,
# and the one a build reads when nothing selects another.
#
# The engine carries no runtime configuration. Every setting below is read at
# build time and emitted as a `pub const`, so changing one means rebuilding.
#
# Select a different config with the `YORKIE_CONFIG` environment variable, whose
# value is a path to a TOML file, resolved against the repository root when
# relative:
#
#     YORKIE_CONFIG=configs/test.toml cargo nextest run --all-features
#
# Format rules, each a hard build error and never a silent fallback:
#
#   * flat `key = value` pairs only; no `[table]` headers. The one other form
#     is an array of inline tables, `[ { key = value, ... }, ... ]`, which may
#     run over several lines, for the one key that takes a list;
#   * every key in the schema must be present, exactly once;
#   * no key outside the schema may appear;
#   * each value must have the declared type (integer / boolean / string /
#     array) and sit inside the declared range or choice list.
#
# `configs/test.toml` is the config the test suite runs against.

# ---------------------------------------------------------------------------
# Engine core
# ---------------------------------------------------------------------------

# Transposition-table size in MiB (USI option `USI_Hash`). The table is a
# `static` array of this size in the binary's BSS, so the value is an array
# length: nothing allocates it, nothing can resize it, and a build carries
# exactly the table it will play with.
usi_hash = 1024

# Worker-pool size (`Threads`). Each worker is pinned to one logical CPU of the
# machine the binary is built on (`cpu_assignment` below), so this may not exceed
# that machine's online CPU count — a larger value is a build error, not a
# quietly oversubscribed pool.
threads = 1

# Number of principal variations reported per search (`MultiPV`). Honoured with
# `verbose2`, the feature whose search `info` lines can report a second line;
# without it the root search is single-line and only `1` builds.
multi_pv = 1

# Directory holding the source network `nn.bin`, which the build reads once and
# converts into the file the engine plays with. Relative paths are taken from
# the repository root. Nothing at run time opens this directory.
original_eval_dir = "eval"

# Directory the engine reads its evaluation file from (`EvalDir`), and the
# directory the build writes that file into. Relative paths are taken from the
# directory the engine binary sits in, so moving the binary somewhere else means
# taking this directory along with it.
eval_dir = "eval"

# NNUE fixed-point output scale (`FV_SCALE`).
fv_scale = 16

# Which logical CPU each worker thread is pinned to. Every worker gets exactly
# one, chosen when the binary is built; nothing at run time revisits the choice,
# and the memory each worker uses follows the NUMA node of its CPU.
#
# `"auto"` picks `threads` CPUs from those `cpu_ledger` below does not already
# record as taken, round-robin over the machine's L3 cache domains: one worker on
# the first free CPU of the first domain, the next on the first free CPU of the
# second, and so on, wrapping around. The pick has no randomness in it, so the
# same machine and the same ledger always give the same CPUs.
#
# The other form is an explicit list in the usual `0,2,4-7` shorthand. It must
# name exactly `threads` CPUs, all online, none twice. Such a list consults no
# ledger and appears in none: it says which CPUs this binary runs on, and keeping
# it clear of the other builds on the machine is the business of whoever wrote
# it.
#
# `"none"` pins no worker at all, for measurement builds only: it consults and
# writes no ledger, places no memory on a NUMA node of its own accord, and
# `isready` asks nothing of the process's CPU affinity. Every process of such a
# binary runs wherever whatever started it allows — which is what lets many
# processes of one binary share a machine, each confined to its own CPU with
# `taskset`. Pinning never changes what the search computes, only where it runs.
#
# Under `"auto"` or a list, the engine's own non-search threads (the USI reader
# and the threads it starts, such as the keep-alive timer) are pinned too: to
# the machine's lowest-numbered online CPU, the one a host keeps its other work
# on. They stay off every worker's CPU unless a worker is given that CPU as
# well.
cpu_assignment = "auto"

# The file recording which CPUs each build on the same machine took: one build per
# line, so building several engines on one machine gives each its own CPUs
# instead of all of them the same ones, and so an orchestrator can read which
# binary owns which CPU. A relative path is taken from the repository root.
#
# Read and written only under `cpu_assignment = "auto"`, which is also the only
# form that requires a file here; a config naming its CPUs outright leaves this
# empty.
#
# A build already in the file keeps its line, so rebuilding takes nothing more.
# Deleting the file hands every CPU back and starts the allocation over.
cpu_ledger = ".yorkie-cpu-ledger"

# Run one worker — the last — at the lowest scheduling priority (nice 19), on
# the machine's lowest-numbered online CPU, where the engine's own non-search
# threads (the USI reader and the keep-alive timer) are pinned. Everything
# else that has to run on the machine then takes its time from that one
# worker rather than from a worker at random, so a build can have one worker
# per CPU (`threads` equal to the CPU count) without stalling the host.
#
# Never the main worker, so `threads` must be at least 2. Under `"auto"` the
# other workers are picked round that CPU and the ledger must not give it to
# another build; an explicit list must name it. Under `"none"` nothing is
# pinned and the last worker is simply lowered.
#
# `bestmove` never waits on a worker that the scheduler is holding back: the
# search collects it for at most a few milliseconds after the stop, and a
# result that has not arrived by then is left out of the vote.
low_priority_worker = false

# How many NUMA nodes the machine this binary is built on has to have.
#
# The layout itself — the node count and each node's CPUs — is read off the
# building machine's sysfs and compiled in, so the engine never discovers it at
# run time. Building therefore needs a Linux host whose `/sys` reports a
# topology; a host without NUMA hardware still reports one node and builds
# normally, and a kernel built without NUMA support, whose sysfs has no
# `devices/system/node` directory at all, is read as one node too.
#
# `"auto"` takes whatever that machine has. An integer additionally requires the
# resolved count to equal it, so a config pinned to the machine the engine plays
# on cannot be built somewhere else by accident.
#
# Either way the binary is built for one machine: on any other — or under a
# `taskset` / `cpuset` that hides a CPU a worker is pinned to — `isready` reports
# the difference and withholds `readyok` rather than playing on a machine that is
# not there.
numa_nodes = "auto"

# Keep searching once the engine has answered a clocked `go`: the position its
# own move reaches is searched, with no limit, until the next command arrives.
# The opponent is on their clock then, so the time is free; what the search
# leaves behind — a warm transposition table and warm history tables — is what
# the next move's search starts from. No `bestmove` ever comes out of it.
ponder = true

# ---------------------------------------------------------------------------
# Opening book
#
# `book_options_v2` selects which of the two book-option groups is live: `false`
# the V1 surface, `true` the black/white-split filters.
#
# The V1-only and V2-only keys below are both always present, since the schema is
# one fixed key set, and a key the selected profile does not register reads as
# its type's zero. That is why `book_depth_white_limit` carries the V2 default
# while this file selects V1 — under V1 it is inert.
# ---------------------------------------------------------------------------

book_options_v2 = false

# Consult the book at all (`USI_OwnBook`).
usi_own_book = true

# V1 only (`NarrowBook`): drop book moves played only once.
narrow_book = false

# Ply past which the book is no longer consulted (`BookMoves`).
#
# 10000 is the top of the key's range and above the length of any game, so
# this config consults the `.ybb` book at every ply. A ply cut-off would also
# fall short when a tournament server plays moves before the game proper: those
# moves count towards the game ply, and a cut-off at ply N would then stop the
# book that many moves early.
book_moves = 10000

# Percentage chance of ignoring the book on any one probe (`BookIgnoreRate`).
book_ignore_rate = 0

# Book file and directory (`BookFile` / `BookDir`). `no_book` is bookless; every
# other choice names a `.ybb` file.
book_file = "no_book"
book_dir = "book"

# The yorkie book: a second book format, probed before the `.ybb` book above.
# Some of its entries are path-dependent — they apply only when certain earlier
# positions have already occurred in the game — so it is probed with the whole
# game from the `position` command, not the current position alone. A position
# it answers is played from it; one it lacks falls through to the `.ybb` probe.
#
# The value is a list of yorkie book files, each with a selection weight:
#
#     yorkie_book_files = [
#       { file = "best.ykb", weight = 70 },
#       { file = "wide.ykb", weight = 30 },
#     ]
#
# At every `usinewgame` the engine draws one entry at random, with probability
# its `weight` divided by the sum of all weights, reports it as
# `info string yorkie book: <file>`, and plays that game from it; a session
# that starts a game without `usinewgame` plays from the first entry. One entry
# is always chosen, whatever its weight. An empty list, `[]`, disables the
# yorkie book, and a disabled yorkie book costs nothing.
#
# `file` is a file name, resolved inside `book_dir` exactly as `book_file` is;
# `weight` is an integer from 1 to 4294967295. A weight below 1, an empty
# `file` and a `file` named twice are build errors. The build generates the
# list as `YORKIE_BOOK_FILES: &[(&str, u32)]`, `(file, weight)` in the order
# written.
#
# Every file listed is loaded at `isready` and stays loaded for the session, so
# choosing one at `usinewgame` reads nothing from disk. A file that is missing
# or fails its format checks (magic, version, checksum, offsets, key order) is
# reported with an `info string` and `readyok` is withheld.
#
# Of the settings above, `usi_own_book` and `book_ignore_rate` apply to it too,
# and `book_pv_moves` shapes the PV of a hit from it. `book_moves` does not: it
# is consulted at any ply. Neither do the mirror, ply and move-count settings or
# the eval / depth filters, which are `.ybb`-only.
yorkie_book_files = []

# How many leading moves of the `position` command the yorkie book's game path
# leaves out. A path-dependent entry applies only when every position in its
# support list has occurred in the game, and the positions counted as occurred
# are the starting position of the `position` command and the position after
# each of its moves. With this set to N, the starting position and the
# positions after moves 1 to N-1 are not counted: the position after move N is
# the first that is. A command with fewer than N moves counts the current
# position alone.
#
# This is for a tournament whose server plays a fixed preamble before the game
# proper — for example four king moves, `5i5h 5a5b 5h5i 5b5a`, that return the
# board to the initial position. The preamble then arrives as the first moves of
# every `position` command, and the positions it passes through were never
# meant to count as part of the game the book was built for. Such a tournament
# sets this to the preamble's length, 4 in that example, in its own copy of
# this config.
#
# `0` counts every position, and is free: with it the probe reads exactly the
# positions it would without this key. Nothing but the path-dependent entries'
# support check reads it — shared entries, the `.ybb` book, the search and its
# repetition detection all see the whole game. An integer from 0 to 1024.
yorkie_book_path_skip_moves = 0

# V1 only (`BookEvalDiff`): reject a book move whose value trails the best book
# move's by more than this.
book_eval_diff = 30

# V2 only (`BookEvalBlackDiff` / `BookEvalWhiteDiff`): the same filter, split by
# the root side to move.
book_eval_black_diff = 0
book_eval_white_diff = 0

# Absolute value floor per root side to move (`BookEvalBlackLimit` /
# `BookEvalWhiteLimit`). Registered under both profiles.
book_eval_black_limit = 0
book_eval_white_limit = -140

# V1 only (`BookDepthLimit`): reject a book move searched shallower than this.
book_depth_limit = 16

# V2 only (`BookDepthBlackLimit` / `BookDepthWhiteLimit`): the same floor, split
# by the root side to move.
book_depth_black_limit = 0
book_depth_white_limit = 5

# Stream the book from disk instead of loading it into memory
# (`BookOnTheFly`). The V2 default is `true`; V1's is `false`.
book_on_the_fly = false

# V1 only (`ConsiderBookMoveCount`): weight book-move selection by play count.
consider_book_move_count = false

# How many book moves to emit as a PV (`BookPvMoves`).
book_pv_moves = 8

# Match book positions ignoring their recorded ply (`IgnoreBookPly`). The V2
# default is `true`; V1's is `false`.
#
# On here. Some tournament servers play a fixed preamble before the game proper
# — for example four king moves, `5i5h 5a5b 5h5i 5b5a`, that return the board
# to the initial position — and the preamble arrives as the first moves of
# every `position` command. The game then starts on ply 5, every position sits
# four plies later than the ply its `.ybb` entry was recorded at, and with the
# ply compared no entry would match. Ignoring the ply matches each entry by its
# board alone.
ignore_book_ply = true

# Also probe the mirrored position (`FlippedBook`).
flipped_book = true

# ---------------------------------------------------------------------------
# Search behaviour
# ---------------------------------------------------------------------------

# Entering-king (nyugyoku) declaration rule (`EnteringKingRule`).
entering_king_rule = "CSARule27"

# Per-`go` depth / node ceilings, `0` meaning unlimited (`DepthLimit` /
# `NodesLimit`). An explicit `go depth` / `go nodes` token still wins. Honoured
# with `verbose2`, the feature those two clauses need as well; without it the
# engine has no ceiling of either kind and only `0` builds.
depth_limit = 0
nodes_limit = 0

# Ply past which the search adjudicates an unconditional draw
# (`MaxMovesToDraw`); `0` is unlimited. A position reached after the last move
# is a draw even when that move mates. The time management also plans its
# remaining-move estimate against this ply.
max_moves_to_draw = 512

# Score every forced mate the engine delivers with one flat winning value
# instead of the usual "shorter mate scores higher" gradient. A shorter mate is
# then worth no more than a longer one, so once any mate is proven the search
# stops spending time on finding a shorter one. Being mated keeps the gradient,
# so the engine still prefers the longest defence. A mate counts as the
# engine's only when it lands inside the `max_moves_to_draw` limit.
#
# The engine's side is the side it plays in the game, also while it searches
# the position after its own move (`ponder` above). `info` lines still print
# `score mate N`, with N taken from the length of the principal variation.
#
# On here, so the tournament binary plays with it: in a game the only question
# about a mate is whether it is forced, not how short it is.
flatten_winning_mate = true

# Inside the search, treat a position as repeated the second time it appears
# among the last 16 plies, instead of only at its fourth occurrence (the game's
# sennichite rule). The repeated position is scored as the game would score its
# fourth occurrence: a draw, a loss for the side giving perpetual check, or a
# win or loss when one side's hand has strictly gained or lost pieces since the
# earlier occurrence. The lookback may reach into the game played before the
# position the search starts from. This is a search shortcut only: the game
# still ends in a repetition draw at the fourth occurrence alone.
#
# On here, so the tournament binary plays with it: a line that returns to a
# recent position is cut there, which spends the search on lines that make
# progress.
quick_draw = true

# PV-output throttle in milliseconds, `0` meaning never suppress
# (`PvInterval`).
pv_interval = 300

# Collect each PV from the transposition table (`ConsiderationMode`), and emit a
# PV on a fail-high / fail-low (`OutputFailLHPV`).
consideration_mode = false
output_fail_lh_pv = true

# Per-colour draw score in centipawns, from each colour's own perspective
# (`DrawValueBlack` / `DrawValueWhite`). Set for a game in which a draw counts
# 0.4 to black and 0.6 to white: under the win-rate model
# `1 / (1 + exp(-cp / 600))` those expectations are about -243 cp and +243 cp,
# rounded here to -240 and +240. Black then avoids a draw unless it is more than
# 240 cp behind, and white takes one unless it is more than 240 cp ahead.
draw_value_black = -240
draw_value_white = 240

# Resign when the centipawn-normalized best score is at or below `-this`
# (`ResignValue`). The default is effectively unreachable.
resign_value = 99999

# Also consider the non-promoting moves the default generator suppresses
# (`GenerateAllLegalMoves`).
generate_all_legal_moves = false

# Amplitude, in centipawns, of the per-position noise the static evaluation
# carries, so play varies from game to game: within one game a position always
# evaluates the same, and after `usinewgame` it evaluates differently. `0` is no
# noise, which is what every build makes of it unless it carries the `random`
# Cargo feature — a build without the feature ignores this key and says so with
# a build warning when it is not 0.
random = 0

# How many root moves the search after the engine's own move (`ponder` above)
# reads without late-move reduction, in the root's move order. That search does
# not know which reply the opponent will play, so it searches each plausible
# one to full depth instead of one predicted reply deep. `1` is the single-line
# search a `go` gets (only the first move is never reduced), `0` is every root
# move, and the largest count is 255. Has no effect on a `go` search, and no
# effect at all when `ponder` is false.
ponder_root_moves = 0

# A root move of that search whose score is more than this many centipawns
# below the best root move's is reduced as usual, whatever `ponder_root_moves`
# says. Read only by that search.
ponder_root_margin = 500

# How much of the time the ponder search spent on the reply the opponent then
# played is counted as already elapsed by the next search, in percent of that
# time. `0` counts none of it (the search budgets its time as if it had not
# pondered); `100` counts all of it. Read only when `ponder` is true.
ponder_credit = 100

# Spread the parallel workers apart. Every worker of a multi-worker build
# searches the same tree in the same move order, sharing only the
# transposition table, so much of what one worker searches another has already
# searched. With this on, each worker keeps a duplicate count: a store at the
# end of a node that finds an entry for the position at least as deep, not
# written by this worker in this iteration, raises it by one (up to `threads`),
# any other such store lowers it by one. While the count `c` is above zero, every
# move of a node after its first is taken a random distance `k` in `0..n` ahead
# of the next one in the move order, `n` being the smaller of `2^c`, 16 and the
# moves left (the passed-over moves follow in their order). Off, nothing of
# it is compiled in. With `threads = 1` it has no effect at all.
lazy_smp_spread = false

# Put off a move another parallel worker is searching right now. The workers
# share a small table, apart from the transposition table, of the
# (position, move) pairs some worker is in the middle of searching at a
# remaining depth of 3 or more. At such a node, every move after the first one
# the node searches is looked up first: if another worker is on it, it goes to a
# list of put-off moves and the node goes on with its next move; otherwise the
# worker enters the pair, searches the move and removes the pair again. Once the
# node's other moves are done, and unless one of them cut the node off, the
# put-off moves are searched in their order without looking them up, by when the
# other worker's result is usually in the transposition table. Combined with
# `lazy_smp_spread`, the spread chooses the next move and this test applies to
# it. Off, nothing of it is compiled in. With `threads = 1` it has no effect at
# all.
lazy_smp_defer = false

# ---------------------------------------------------------------------------
# Time management
# ---------------------------------------------------------------------------

# Average and worst-case GUI round-trip margins in milliseconds
# (`NetworkDelay` / `NetworkDelay2`). Subtracted from the clock so the search
# never overruns.
network_delay = 120
network_delay2 = 1120

# Floor on a move's optimum time in milliseconds, before the network delay is
# subtracted (`MinimumThinkingTime`).
minimum_thinking_time = 2000

# Percentage multiplier on the optimum time (`SlowMover`); 200 thinks twice as
# long.
slow_mover = 100

# Use the clock right up to each whole second (`RoundUpToFullSecond`).
round_up_to_full_second = true
