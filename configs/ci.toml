# Small tournament config for CI: every key matches configs/tsec7-part1.toml except tt_bytes, shrunk to 256 MiB so tests can allocate the baked TT. Never build a production binary from this. Pinned by tt.rs tournament_tests::cluster_count_const_is_compile_time_and_even — update both together.

# NNUE evaluation scale (eval hot path). Matches the FV_SCALE USI option default.
fv_scale = 16

# Maximum-moves draw horizon in plies. Matches the Max_Moves_To_Draw USI option default.
max_moves_to_draw = 512

# Per-side draw contempt in Value units: Black scores a draw as -draw_contempt, White as +draw_contempt (the event scores draws asymmetrically). Fixed at fv_scale = 16.
draw_contempt = 300

# TT size in BYTES: 256 MiB (the engine default USI_Hash), small so tests fit on a CI runner. Must stay a multiple of the 32-byte TtCluster to keep the cluster count even (compile-time assert in tt.rs).
tt_bytes = 268435456

# Time-management options, read once at think-start. Placeholders equal to the current USI option defaults; tuned values come later.

# Per-move round-trip overhead in ms (applied in timeman::compute). Matches the Move_Overhead USI option default.
move_overhead = 200

# Near-deadline safety cushion in ms (timeman::compute low-time cap). Matches the Timeout_Safety_Margin USI option default.
timeout_safety_margin = 1200

# Floor on committed (optimum) think time in ms. Matches the Minimum_Thinking_Time USI option default.
minimum_thinking_time = 1000

# Opening time-allocation weight as a percent (100 = neutral). Matches the Opening_Time_Weight USI option default.
opening_time_weight = 100

# Byoyomi safety margin in ms, subtracted off the byoyomi period. Matches the Byoyomi_Margin USI option default.
byoyomi_margin = 500

# Whether to emit a USI `ponder` move after `bestmove`. Matches the USI_Ponder USI option default.
usi_ponder = true
