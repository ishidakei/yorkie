# The config the engine plays rated games with. Select it with the
# `YORKIE_CONFIG` environment variable:
#
#     YORKIE_CONFIG=configs/tournament.toml cargo build --release
#
# Every value is `configs/default.toml`'s except the ones marked DIFFERENCE,
# which say why at their own key.
#
# The schema and its rules are identical to `configs/default.toml`, which carries
# the per-key commentary.

# ---------------------------------------------------------------------------
# Engine core
# ---------------------------------------------------------------------------

usi_hash = 1024
threads = 1
multi_pv = 1
original_eval_dir = "eval"
eval_dir = "eval"
fv_scale = 16
cpu_assignment = "auto"
cpu_ledger = ".yorkie-cpu-ledger"
numa_nodes = "auto"
ponder = true

# ---------------------------------------------------------------------------
# Opening book
# ---------------------------------------------------------------------------

book_options_v2 = false
usi_own_book = true
narrow_book = false
book_moves = 16
book_ignore_rate = 0
book_file = "no_book"
book_dir = "book"
yorkie_book_files = []
book_eval_diff = 30
book_eval_black_diff = 0
book_eval_white_diff = 0
book_eval_black_limit = 0
book_eval_white_limit = -140
book_depth_limit = 16
book_depth_black_limit = 0
book_depth_white_limit = 5
book_on_the_fly = false
consider_book_move_count = false
book_pv_moves = 8
ignore_book_ply = false
flipped_book = true

# ---------------------------------------------------------------------------
# Search behaviour
# ---------------------------------------------------------------------------

entering_king_rule = "CSARule27"
depth_limit = 0
nodes_limit = 0
max_moves_to_draw = 0

# DIFFERENCE: false in default.toml. In a game the only question about a mate
# is whether it is forced, not how short it is, so once one is proven the
# search spends its time on nothing else.
flatten_winning_mate = true

# DIFFERENCE: false in default.toml. A line that returns to a recent position
# is cut there, which spends the search on lines that make progress; the game
# rule is unchanged.
quick_draw = true

pv_interval = 300
consideration_mode = false
output_fail_lh_pv = true
draw_value_black = -2
draw_value_white = -2
resign_value = 99999
generate_all_legal_moves = false
random = 0
ponder_root_moves = 0
ponder_root_margin = 500

# ---------------------------------------------------------------------------
# Time management
# ---------------------------------------------------------------------------

network_delay = 120
network_delay2 = 1120
minimum_thinking_time = 2000
slow_mover = 100
round_up_to_full_second = true
