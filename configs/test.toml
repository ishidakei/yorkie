# The config the test suite runs against. Select it with the `YORKIE_CONFIG`
# environment variable:
#
#     YORKIE_CONFIG=configs/test.toml cargo nextest run --all-features
#
# No build has a runtime option surface, so a test cannot dial a setting in with
# `setoption`: the values below are the values every session test sees. Three are
# chosen for the suite rather than for play, and each says so at its own key;
# everything else is `configs/default.toml`'s value.
#
# The schema and its rules are identical to `configs/default.toml`, which carries
# the per-key commentary.

# ---------------------------------------------------------------------------
# Engine core
# ---------------------------------------------------------------------------

# TEST VALUE: the play value is 1024. The table is a `static` array of this
# size, so the value is an array length the compiler has to lay out and every
# `usinewgame` has to walk: a play-sized value here would spend minutes of
# build time on the initializer and clear a gibibyte per test process.
usi_hash = 16

# The session tests pin a deterministic `bestmove` against a direct
# single-worker search; Lazy-SMP with more than one worker is deliberately not
# reproducible move-for-move.
threads = 1

multi_pv = 1
original_eval_dir = "eval"
eval_dir = "eval"
fv_scale = 16
# TEST VALUE: the play config says `"auto"`. A test run builds the same config
# into several output directories at once — a debug build, a release build, a
# miri build — and each of those is a binary of its own, so under `"auto"` each
# would take a CPU of its own and a small machine would run out. The single
# worker of a test build is pinned to CPU 0 instead, which every machine has.
cpu_assignment = "0"

# TEST VALUE: the play config names `.yorkie-cpu-ledger`. Only `"auto"` picks
# from a ledger, and the assignment above names its CPU outright, so a test build
# takes nothing from any ledger and leaves the machine's CPUs to whatever is
# playing on it.
cpu_ledger = ""
numa_nodes = "auto"
usi_ponder = false
stochastic_ponder = false

# ---------------------------------------------------------------------------
# Opening book
# ---------------------------------------------------------------------------

book_options_v2 = false
usi_own_book = true
narrow_book = false
book_moves = 16
book_ignore_rate = 0
book_file = "no_book"
book_dir = "book"
book_eval_diff = 30
book_eval_black_diff = 0
book_eval_white_diff = 0
book_eval_black_limit = 0
book_eval_white_limit = -140
book_depth_limit = 16
book_depth_black_limit = 0
book_depth_white_limit = 5
book_on_the_fly = false
consider_book_move_count = false
book_pv_moves = 8
ignore_book_ply = false
flipped_book = true

# ---------------------------------------------------------------------------
# Search behaviour
# ---------------------------------------------------------------------------

entering_king_rule = "CSARule27"
depth_limit = 0
nodes_limit = 0
max_moves_to_draw = 0

# TEST VALUE: the play value is 300. A throttle makes which iterations print
# depend on how fast the machine ran them, which no assertion can pin.
pv_interval = 0

consideration_mode = false
output_fail_lh_pv = true
draw_value_black = -2
draw_value_white = -2
resign_value = 99999
generate_all_legal_moves = false
random = 0

# ---------------------------------------------------------------------------
# Time management
# ---------------------------------------------------------------------------

network_delay = 120
network_delay2 = 1120
minimum_thinking_time = 2000
slow_mover = 100
round_up_to_full_second = true
