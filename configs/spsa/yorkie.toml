# The search and time-allocation parameters with the values the engine plays
# with. The play config names this file in its `spsa_config` key, and a
# tuning result is adopted by writing its values here; `yaneuraou.toml` beside
# it keeps YaneuraOu's values.
#
# One `name = value` line per parameter the engine registers
# (`crates/yorkie-search/src/params.rs`), every one of them and nothing else.
# Each value is an integer in the units the parameter is registered in: a
# coefficient the engine computes with as a fraction is scaled by the power of
# ten the comment above it gives. The build refuses a file that leaves a
# parameter out, names one the engine does not register, names one twice, or
# gives a value that is not an integer inside the range the engine accepts.

# Razoring: alpha - razor_base - razor_depth * depth^2.
razor_base = 502
razor_depth = 306

# Futility pruning per ply; the no-TT-hit margin is this less 21.
futility_mult = 76

# Null move: tried while static eval >= beta - 16 * depth - 53 * improving + this.
nmp_margin = 378

# Null move: R = this + depth / 3.
nmp_reduction = 7

# ProbCut beta = beta + this - 61 * improving.
probcut_margin = 224

# TT ProbCut at the head of the move loop: beta + this.
small_probcut_margin = 416

# Singular beta = ttValue - (this + 66 * off-PV ttPv) * depth / 55.
singular_margin = 60

# LMR base reduction: ... - delta * lmr_delta / rootDelta + ... + lmr_base.
lmr_base = 1133
lmr_delta = 585

# LMR at a cut node: r += this + 985 * no TT move.
lmr_cut_node = 3611

# Quiet futility at shallow depth: per ply of the reduced depth.
quiet_futility_depth = 120

# Quiescence search futility margin.
qs_futility_margin = 328

# Quiescence search SEE threshold for a capture.
qs_see_margin = -73

# Aspiration window half-width before the score-spread term.
aspiration_delta = 5

# The divisors of the formulas above. A small divisor `d` is registered as
# `k = 1024 * d` and read as `x * 1024 / k`, so a step of 1 on `k` moves the
# quotient by about a thousandth.
#
# Aspiration half-width: aspiration_delta + |mean squared score| / this.
aspiration_spread_div = 9000

# Aspiration window: each fail adds delta * 1024 / this to the half-width.
aspiration_widen_div = 3072

# Aspiration loop: depth - 3 * (search-again count + 1) * 1024 / this.
search_again_div = 4096

# Futility margin: ... + |correction value| / this.
futility_correction_div = 180600

# Null move: R = nmp_reduction + depth * 1024 / this.
nmp_depth_div = 3072

# Null-move verification: nmpMinPly = ply + 3 * (depth - R) * 1024 / this.
nmp_verify_div = 4096

# Singular beta: ... * depth / this.
singular_margin_div = 55

# Singular search depth: new_depth * 1024 / this.
singular_depth_div = 2048

# Quiet pruning at shallow depth: lmr_depth += history / this.
lmr_history_div = 3220

# LMR: r -= |correction value| / this.
lmr_correction_div = 25600

# The time allocation.
#
# Planning horizon in plies: with an increment or byoyomi it is
# tm_move_horizon + tm_opening_inc - min(ply, tm_opening_inc_plies); on a
# sudden-death clock tm_move_horizon + tm_opening_forfeit - min(ply,
# tm_opening_forfeit). The own moves planned for are half of it.
tm_move_horizon = 160
tm_opening_forfeit = 40
tm_opening_inc = 20
tm_opening_inc_plies = 80

# Maximum time: minimum + estimate * tm_max_ratio / 1000 / moves, capped at
# estimate * tm_max_share / 1000.
tm_max_ratio = 5000
tm_max_share = 300

# Falling evaluation: clamp((tm_falling_base / 1000 + tm_falling_average / 1000
# * drop from the previous move's average + tm_falling_iteration / 1000 * drop
# from four iterations back) / 100, tm_falling_min / 10000, tm_falling_max /
# 10000).
tm_falling_base = 11325
tm_falling_average = 2115
tm_falling_iteration = 987
tm_falling_min = 5688
tm_falling_max = 15698

# Best-move stability: r = tm_reduction_base / 1000 + tm_reduction_amplitude /
# 1000 / (1.104 + exp(-tm_reduction_k / 10000 * (depth - last change -
# tm_reduction_center / 100))); the factor is (tm_reduction_previous / 1000 +
# the previous move's r) / (2.2375 * r).
tm_reduction_k = 5189
tm_reduction_center = 1157
tm_reduction_base = 723
tm_reduction_amplitude = 790
tm_reduction_previous = 1455

# Best-move instability: tm_instability_base / 1000 + tm_instability_weight /
# 10000 * aged best-move changes / threads.
tm_instability_base = 1040
tm_instability_weight = 18956

# The factor at depth 10 and up when the best move took most of the nodes, in
# thousandths.
tm_effort_factor = 666

# The next iteration deepens only if it starts within this share of the target
# time, in thousandths.
tm_deepen_share = 503

