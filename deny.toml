# cargo-deny configuration (`cargo deny check`).

[graph]
# The engine only ships for x86-64 Linux, but this configuration deliberately
# keeps every target in the graph: pruning to one would hide a vulnerable or
# wrongly-licensed Windows-only crate that is still resolved into `Cargo.lock`.
all-features = true
# Dev-dependencies are part of the checked surface.
exclude-dev = false

[output]
feature-depth = 1

# Unmaintained and yanked crates are errors, not warnings, so the tree stays free
# of dead dependencies.
[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
unmaintained = "all"
yanked = "deny"
ignore = []

# Yorkie is distributed under GPL-3.0, so the allowlist is restricted to licenses
# that are GPL-3.0-compatible *and* actually present in the dependency tree;
# adding a dependency under anything else must be a conscious edit of this list.
[licenses]
# Enumerated from the resolved tree, not copied from a template. Dual-licensed
# crates are satisfied here by MIT, which is why their other licenses are absent.
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
]
# The workspace crates carry no `license` field, being `publish = false` and
# covered by the repo-root GPL-3.0 `LICENSE`.
private = { ignore = true }
confidence-threshold = 0.8
# The license check defaults to the distributed graph only; including dev- and
# build-dependencies makes the allowlist the complete set of licenses this
# repository touches.
include-dev = true
include-build = true

# Duplicate versions are only a warning: transitive minor-version skew is normal
# churn.
#
# The `deny` list below enforces the rule that the engine must not open a network
# socket. Its failure mode is silent — a transitive dependency pulls in an async
# runtime and nothing looks different locally — so the async/HTTP/TLS runtimes
# are named here and the check fails if any of them enters the graph. cargo-deny
# matches exact crate names, so extend the list when a new runtime shows up
# rather than treating it as exhaustive.
[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { name = "tokio" },
    { name = "async-std" },
    { name = "smol" },
    { name = "reqwest" },
    { name = "hyper" },
    { name = "ureq" },
    { name = "curl" },
    { name = "rustls" },
    { name = "native-tls" },
    { name = "openssl" },
    { name = "actix-web" },
    { name = "actix-rt" },
    { name = "axum" },
    { name = "tonic" },
]
skip = []

# crates.io only: no git dependencies and no alternate registries.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
